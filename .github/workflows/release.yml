name: Release

# Tag and push to cut a release:
#
#     ./scripts/check_versions.sh v0.2.0 && git tag v0.2.0 && git push --tags
#
# The GitHub Release always happens and needs no configuration. Publishing to the
# two extension registries is opt-in: each step is skipped unless its secret is
# set, so this workflow is useful immediately and grows when you want it to.
# See the release checklist in README.md for what each one requires.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    # The full CI suite, not a copy of it — releasing something untested is the
    # one thing a release workflow must not do.
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: The tag must match the declared version
        if: startsWith(github.ref, 'refs/tags/')
        run: ./scripts/check_versions.sh "${{ github.ref_name }}"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # One VSIX per platform now, so collect the whole matrix rather than a name.
      - uses: actions/download-artifact@v8
        with:
          pattern: melic-lsp-vsix-*
          merge-multiple: true
          path: dist

      - name: Attach every vsix to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.vsix --generate-notes

      # Guarded by the tag as well as the secret, so a manual run builds and
      # verifies without pushing anything to a registry.
      # Each platform's build is published separately; a registry picks between them
      # by the target recorded in the package, so all of them go up under one version.
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != '' && startsWith(github.ref, 'refs/tags/')
        run: |
          for vsix in dist/*.vsix; do
              npx --yes @vscode/vsce publish --packagePath "$vsix"
          done

      - name: Publish to Open VSX
        if: env.OVSX_TOKEN != '' && startsWith(github.ref, 'refs/tags/')
        run: |
          for vsix in dist/*.vsix; do
              npx --yes ovsx publish "$vsix" --pat "$OVSX_TOKEN"
          done

      - name: Say what was skipped
        run: |
          [ -n "$VSCE_PAT" ] || echo "::notice::VSCE_PAT not set - skipped the VS Code Marketplace"
          [ -n "$OVSX_TOKEN" ] || echo "::notice::OVSX_TOKEN not set - skipped Open VSX"
