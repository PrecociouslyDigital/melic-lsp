[project]
name = "melic-lsp"
version = "0.1.0"
description = "A prosody language server for ChordPro files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prosodic>=3.10.0",
    "pygls>=2.1",
]

[project.scripts]
melic-lsp = "melic_lsp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/melic_lsp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_prosodic: test imports prosodic (slow; needs the bundled dictionary)",
]

[tool.ty.environment]
python-version = "3.12"
